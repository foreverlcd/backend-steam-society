# coturn base config. NO secrets here.
# At container start (deploy/docker-compose.prod.yml, service coturn) these lines
# are appended from the environment: static-auth-secret, realm, server-name,
# external-ip (Oracle 1:1 NAT: public/private), allowed-peer-ip, listening-ip and
# relay-ip (the VM private IP; keeps coturn off the Docker bridges)
# and cert/pkey (Caddy's certificate for TURN_DOMAIN) or no-tls/no-dtls.

listening-port=3478
tls-listening-port=5349

# Small relay range: must match the Oracle security list and iptables rules.
min-port=49160
max-port=49200

# TURN REST API scheme: the API issues temporary credentials
# (username = "<expiry-unix>:<id>", password = base64(HMAC-SHA1(secret, username))).
use-auth-secret
fingerprint

# Quotas for a small pilot (each call uses ~2 allocations per participant).
user-quota=12
total-quota=200
stale-nonce=600

# Hardening
no-cli
# Relay only UDP (what WebRTC uses). Clients may still reach coturn over TCP/TLS
# (3478/5349); this only turns off RFC 6062 TCP allocations, so nobody can use
# the relay as a TCP proxy (SSH, HTTP) toward the VM.
no-tcp-relay
no-multicast-peers
no-software-attribute
# Never relay to private, loopback or link-local ranges (protects the VM, the
# Docker networks and Oracle's metadata service from being reached via TURN).
# Exception: the start script appends allowed-peer-ip=<VM private IP> so that
# two TURN users can reach each other (both relays live on that IP). Host
# iptables OUTPUT rules (docs/DEPLOY-ORACLE.md, 2.2) limit that exception to
# the relay range 49160-49200.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Logs to stdout (docker compose logs coturn)
log-file=stdout
simple-log
