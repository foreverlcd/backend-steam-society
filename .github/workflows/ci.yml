name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate full
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: steam
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: steam_society
        options: >-
          --health-cmd "pg_isready -U steam -d steam_society"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://steam:test-only-password@127.0.0.1:5433/steam_society?schema=public
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      SESSION_COOKIE_SECURE: 'false'
      WEB_ORIGIN: http://localhost:3001
      APP_URL: http://localhost:3001
      PAYMENTS_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Create test database
        run: |
          # global-setup also creates/migrates it; this makes the step explicit.
          PGPASSWORD=test-only-password psql -h 127.0.0.1 -p 5433 -U steam -d steam_society \
            -tc "SELECT 1 FROM pg_database WHERE datname='steam_society_test'" | grep -q 1 \
            || PGPASSWORD=test-only-password psql -h 127.0.0.1 -p 5433 -U steam -d steam_society \
                 -c "CREATE DATABASE steam_society_test"
      - run: bash scripts/gate.sh full

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: runtime
      - name: Build migrate image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: migrate
